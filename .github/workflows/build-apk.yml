name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix folder structure automatically
        run: |
          mkdir -p app/src/main/java/com/bridge/itell
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          if ls *.kt 1> /dev/null 2>&1; then
            mv *.kt app/src/main/java/com/bridge/itell/
          fi
          if [ -f AndroidManifest.xml ]; then
            mv AndroidManifest.xml app/src/main/
          fi
          if [ -f ic_launcher.png ]; then
            mv ic_launcher.png app/src/main/res/mipmap-xxxhdpi/
          fi
          if [ -f samen_signing.jks ]; then
            cp samen_signing.jks app/samen_signing.jks
          fi

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SamenPro"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.bridge.itell"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.bridge.itell"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 12
                  versionName = "4.8"
              }

              signingConfigs {
                  create("samenFixed") {
                      storeFile = file("samen_signing.jks")
                      storePassword = "SamenPro2026!"
                      keyAlias = "samenpro"
                      keyPassword = "SamenPro2026!"
                  }
              }

              buildTypes {
                  debug {
                      signingConfig = signingConfigs.getByName("samenFixed")
                  }
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("samenFixed")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("io.socket:socket.io-client:2.1.0")
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SamenPro-v4.8-APK
          path: app/build/outputs/apk/debug/app-debug.apk
